<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIE-Translate - Cài đặt</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
      width: 390px;
      max-width: 100%;
      margin: 0 auto;
      padding: 16px;
      background: #0b0f19;
      color: #f3f4f6;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid #1f2937;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
    }
    .version {
      font-size: 11px;
      background: #1e293b;
      color: #60a5fa;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
    }
    .toggles {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .toggle-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      color: #d1d5db;
      cursor: pointer;
      user-select: none;
    }
    .toggle-label input {
      accent-color: #10b981;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
    .field {
      margin-bottom: 14px;
    }
    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    label {
      font-weight: 600;
      font-size: 13px;
      color: #e5e7eb;
    }
    .get-key-link {
      font-size: 12px;
      color: #3b82f6;
      text-decoration: none;
      font-weight: 600;
    }
    .get-key-link:hover {
      text-decoration: underline;
    }
    select,
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 9px 11px;
      font-size: 13px;
      background: #131c2e;
      color: #f9fafb;
      border: 1px solid #2e3b52;
      border-radius: 7px;
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus,
    input:focus {
      border-color: #3b82f6;
    }
    .key-input-group {
      display: flex;
      gap: 8px;
    }
    .key-input-group input {
      flex: 1;
    }
    .btn-toggle-key {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 0 12px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-toggle-key:hover {
      background: #334155;
      color: #ffffff;
    }
    .model-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 11.5px;
      background: rgba(16, 185, 129, 0.14);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 3px 9px;
      border-radius: 6px;
      font-weight: 600;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0 14px;
      font-size: 12.5px;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-row input {
      accent-color: #2563eb;
      width: 15px;
      height: 15px;
      cursor: pointer;
    }
    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-save {
      flex: 1;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 10px 14px;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save:hover {
      background: #1d4ed8;
    }
    .btn-test {
      background: #1e293b;
      color: #f3f4f6;
      border: 1px solid #334155;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-test:hover {
      background: #334155;
    }
    .btn-test:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    #status {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      line-height: 1.45;
      word-break: break-word;
    }
    #status.status-ok {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    #status.status-err {
      display: block;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
    }
    #status.status-wait {
      display: block;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #93c5fd;
    }
    .tip-box {
      margin-top: 12px;
      font-size: 11.5px;
      color: #9ca3af;
      line-height: 1.45;
    }
    .tip-box b {
      color: #d1d5db;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>VIE-Translate</span>
      <span class="version">v0.4</span>
    </div>
    <div class="toggles">
      <label class="toggle-label" title="Hiển thị cả phụ đề gốc và tiếng Việt">
        <input type="checkbox" id="dualSub" checked>
        <span>Song ngữ</span>
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="enabled" checked>
        <span>Đang bật</span>
      </label>
    </div>
  </div>

  <div class="field">
    <div class="label-row">
      <label for="provider">Nhà cung cấp API (Free):</label>
    </div>
    <select id="provider">
      <option value="groq">Groq Cloud (Free - Siêu tốc độ)</option>
      <option value="gemini">Google Gemini AI (Free - Theo ngữ cảnh)</option>
      <option value="gtx">Google Translate (Free - Không cần Key)</option>
    </select>
  </div>

  <div id="apiSection">
    <div class="field">
      <div class="label-row">
        <label for="model">Model AI:</label>
      </div>
      <select id="model">
        <option value="auto">✨ Tự động dò Model đang hoạt động (Khuyên dùng)</option>
      </select>
      <div id="detectedModelBadge" class="model-badge" style="display: none;"></div>
    </div>

    <div class="field">
      <div class="label-row">
        <label id="apiKeyLabel" for="apiKey">Groq API Key (gsk_...):</label>
        <a id="getKeyLink" class="get-key-link" href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer">
          Lấy key Groq Free ↗
        </a>
      </div>
      <div class="key-input-group">
        <input type="password" id="apiKey" placeholder="Dán gsk_... hoặc AQ.Ab8... / AIza..." autocomplete="off">
        <button type="button" id="toggleKeyBtn" class="btn-toggle-key">Hiện</button>
      </div>
    </div>

    <label class="checkbox-row">
      <input type="checkbox" id="fallbackToFree" checked>
      <span>Tự động dùng Google Translate nếu chưa có Key / hết hạn mức</span>
    </label>
  </div>

  <div class="btn-group">
    <button id="saveBtn" class="btn-save">Lưu cài đặt</button>
    <button id="testBtn" class="btn-test" type="button">Test API</button>
  </div>

  <div id="status"></div>

  <div class="tip-box">
    💡 <b>Tự động thông minh:</b> Khi bạn dán API Key (<code>gsk_...</code> của Groq hoặc <code>AQ.</code> / <code>AIza...</code> của Gemini), hệ thống sẽ tự nhận diện nhà cung cấp và tự động dò tìm model miễn phí đang hoạt động.
  </div>

  <script src="options.js"></script>
</body>
</html>
